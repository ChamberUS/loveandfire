name: Deploy LovenFire via FTP Locaweb

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: Publicar arquivos PHP na Locaweb
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do GitHub
        uses: actions/checkout@v4

      - name: Enviar arquivos para Locaweb via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.PASS }}
          port: 21
          protocol: ftp
          local-dir: ./
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            app/**
            msn-realtime-chat/**